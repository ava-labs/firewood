[package]
name = "firewood-macros"
version = "0.7.1"
edition.workspace = true
authors = [
     "Ron Kuris <ron.kuris@avalabs.org>",
]
description = "Proc macros for Firewood metrics"
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
# Regular dependencies
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits"] }

[dev-dependencies]
# Workspace dependencies
firewood-metrics.workspace = true
test-case.workspace = true
# Regular dependencies
# `firewood-storage` depends on this crate, so it publishes after it. Without a
# version, `cargo publish` strips this dev-dependency rather than requiring the
# not-yet-published `firewood-storage` release on crates.io.
firewood-storage = { path = "../storage" }
trybuild = "1.0"

[lints]
workspace = true
