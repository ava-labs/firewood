# The C-Chain reexecution benchmark suite: one of the two components of
# benchmarks.yaml, and independently dispatchable for a one-off reexecution
# over a custom block range.
#
# This workflow triggers AvalancheGo's benchmark and produces the resulting
# JSON as an artifact. Publishing to the dashboard is benchmarks.yaml's
# `publish` job, which is the single writer of data.js on the benchmark-data
# branch.
name: bench-cchain

on:
  workflow_call:
    inputs:
      label:
        description: 'Identifies this run in the summary and in the artifact name (must be unique among a caller''s legs)'
        required: true
        type: string
      test:
        description: 'Predefined test (leave empty to use the custom parameters below)'
        default: ''
        type: string
      config:
        description: 'Config (e.g., firewood, hashdb)'
        default: 'firewood'
        type: string
      start-block:
        default: ''
        type: string
      end-block:
        default: ''
        type: string
      block-dir-src:
        default: ''
        type: string
      current-state-dir-src:
        default: ''
        type: string
      runner:
        description: 'Runner to use in AvalancheGo'
        required: true
        type: string
      timeout-minutes:
        description: 'Timeout in minutes'
        default: ''
        type: string
      firewood:
        description: 'Firewood commit/branch/tag to test (leave empty to use the commit that triggered the workflow)'
        default: ''
        type: string
      avalanchego:
        description: 'AvalancheGo commit/branch/tag to test against'
        default: 'master'
        type: string
      libevm:
        description: 'libevm commit/branch/tag to test (leave empty to use AvalancheGo version of libevm)'
        default: ''
        type: string
    outputs:
      artifact-pattern:
        description: Artifact name pattern holding this suite's benchmark output.
        value: cchain-output-*
    secrets:
      FIREWOOD_AVALANCHEGO_GITHUB_TOKEN:
        description: Token permitted to dispatch AvalancheGo's benchmark workflow.
        required: true
  workflow_dispatch:
    inputs:
      firewood:
        description: 'Firewood commit/branch/tag to test (leave empty to use the commit that triggered the workflow)'
        default: ''
      libevm:
        description: 'libevm commit/branch/tag to test (leave empty to use AvalancheGo version of libevm)'
        default: ''
      avalanchego:
        description: 'AvalancheGo commit/branch/tag to test against'
        default: 'master'
      test:
        description: 'Predefined test (leave empty to use custom parameters below)' # https://github.com/ava-labs/avalanchego/blob/a85295d87193b30ff17c594680dadd6618022f5e/scripts/benchmark_cchain_range.sh#L63
        default: ''
      config:
        description: 'Config (e.g., firewood, hashdb)'
        default: 'firewood'
      start-block:
        default: ''
      end-block:
        default: ''
      block-dir-src:
        description: 'Block directory source (e.g., cchain-mainnet-blocks-1m-ldb [without S3 path])'
        default: ''
      current-state-dir-src:
        description: 'Current state directory source (e.g., cchain-mainnet-blocks-30m-40m-ldb [without S3 path])'
        default: ''
      runner:
        description: 'Runner to use in AvalancheGo'
        required: true
      timeout-minutes:
        description: 'Timeout in minutes'
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    # Dispatching AvalancheGo's workflow needs a secret only the canonical
    # repo has. Skip on forks.
    if: github.repository == 'ava-labs/firewood'
    runs-on: ubuntu-latest
    steps:
      # NOTE: This checkout is only to get the bench-cchain-reexecution.sh script.
      # We're not building or testing Firewood here—the script triggers AvalancheGo's
      # workflow via API and passes FIREWOOD_REF to it. AvalancheGo is responsible
      # for checking out and building Firewood at that ref.
      - name: Checkout Firewood
        uses: actions/checkout@v6

      - name: Trigger C-Chain Reexecution Benchmark
        run: ./scripts/bench-cchain-reexecution.sh trigger
        env:
          GH_TOKEN: ${{ secrets.FIREWOOD_AVALANCHEGO_GITHUB_TOKEN }}
          # Custom mode (ignored when TEST is specified)
          CONFIG: ${{ inputs.config }}
          START_BLOCK: ${{ inputs.start-block }}
          END_BLOCK: ${{ inputs.end-block }}
          BLOCK_DIR_SRC: ${{ inputs.block-dir-src }}
          CURRENT_STATE_DIR_SRC: ${{ inputs.current-state-dir-src }}
          # Refs. inputs.firewood controls what gets benchmarked (passed to
          # AvalancheGo); where the results are stored is the caller's business.
          FIREWOOD_REF: ${{ inputs.firewood || github.sha }}
          AVALANCHEGO_REF: ${{ inputs.avalanchego }}
          LIBEVM_REF: ${{ inputs.libevm }}
          # Execution
          TEST: ${{ inputs.test }}
          RUNNER: ${{ inputs.runner }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}

      # Consumed by the caller's publish job; see the header comment. On a
      # standalone dispatch nothing consumes it, and the artifact is the run's
      # only record of the results.
      - name: Upload benchmark output
        uses: actions/upload-artifact@v7
        with:
          name: cchain-output-${{ inputs.label || 'manual' }}
          path: ./results/benchmark-output.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Benchmark: ${{ inputs.label || 'manual' }}"
            echo
            if [[ -n "${{ inputs.test }}" ]]; then
              echo "| Parameter | Value |"
              echo "|-----------|-------|"
              echo "| Test | \`${{ inputs.test }}\` |"
            else
              echo "| Parameter | Value |"
              echo "|-----------|-------|"
              echo "| Config | \`${{ inputs.config }}\` |"
              echo "| Blocks | \`${{ inputs.start-block }}\` → \`${{ inputs.end-block }}\` |"
              echo "| Block source | \`${{ inputs.block-dir-src }}\` |"
              echo "| State source | \`${{ inputs.current-state-dir-src }}\` |"
            fi
            echo "| Firewood | \`${{ inputs.firewood || github.sha }}\` |"
            echo "| AvalancheGo | \`${{ inputs.avalanchego || 'master' }}\` |"
            echo "| libevm | \`${{ inputs.libevm || '-' }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
