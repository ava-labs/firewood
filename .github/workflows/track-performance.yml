# Triggers AvalancheGo's C-Chain reexecution benchmark and publishes
# results to GitHub Pages for trend analysis.
name: C-Chain Reexecution Performance Tracking

on:
  # TODO(#2270): enable the schedule once notification channels resolved.
  # schedule:
  #   # These cron expressions are matched exactly in configure-benchmark to set parameters
  #   # Weekdays at 05:00 UTC (00:00 ET) - 1M blocks: 40M → 41M
  #   - cron: '0 5 * * 1-5'
  #   # Weekdays at 05:05 UTC - 500k blocks: 33M -> 33.5M
  #   - cron: '5 5 * * 1-5'
  workflow_dispatch:
    inputs:
      firewood:
        description: 'Firewood commit/branch/tag to test (leave empty to use the commit that triggered the workflow)'
        default: ''
      libevm:
        description: 'libevm commit/branch/tag to test (leave empty to use AvalancheGo version of libevm)'
        default: ''
      avalanchego:
        description: 'AvalancheGo commit/branch/tag to test against'
        default: 'master'
      test:
        description: 'Predefined test (leave empty to use custom parameters below)' # https://github.com/ava-labs/avalanchego/blob/a85295d87193b30ff17c594680dadd6618022f5e/scripts/benchmark_cchain_range.sh#L63
        default: ''
      config:
        description: 'Config (e.g., firewood, hashdb)'
        default: 'firewood'
      start-block:
        default: ''
      end-block:
        default: ''
      block-dir-src:
        description: 'Block directory source (e.g., cchain-mainnet-blocks-1m-ldb [without S3 path])'
        default: ''
      current-state-dir-src:
        description: 'Current state directory source (e.g., cchain-mainnet-blocks-30m-40m-ldb [without S3 path])'
        default: ''
      runner:
        description: 'Runner to use in AvalancheGo'
        required: true
      timeout-minutes:
        description: 'Timeout in minutes'
        default: ''

permissions: {}

jobs:
  configure-benchmark:
    permissions: {}
    # Triggers AvalancheGo workflows and pushes to benchmark-data —
    # both require secrets and a repo state that only the canonical
    # repo has. Skip on forks.
    if: github.repository == 'ava-labs/firewood'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      test: ${{ steps.resolve.outputs.test }}
      config: ${{ steps.resolve.outputs.config }}
      start-block: ${{ steps.resolve.outputs.start-block }}
      end-block: ${{ steps.resolve.outputs.end-block }}
      block-dir-src: ${{ steps.resolve.outputs.block-dir-src }}
      current-state-dir-src: ${{ steps.resolve.outputs.current-state-dir-src }}
      runner: ${{ steps.resolve.outputs.runner }}
      timeout-minutes: ${{ steps.resolve.outputs.timeout-minutes }}
    steps:
      - name: Resolve benchmark config
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Common config for all scheduled runs
            echo "config=firewood" >> "$GITHUB_OUTPUT"
            echo "runner=avago-runner-i4i-2xlarge-local-ssd" >> "$GITHUB_OUTPUT"

            # Cron strings must match exactly from schedule definitions above
            case "${GITHUB_EVENT_SCHEDULE}" in
              # TODO(elvis339): Remove '0 5 * * *' match and weekend guard once resolved:
              # https://github.com/actions/runner/issues/4241
              # GitHub's scheduler fires a stale cron ('0 5 * * *') from a previous
              # workflow version instead of the current '0 5 * * 1-5'. When that happens
              # on a weekend, skip the run to avoid wasting runner time.
              "0 5 * * 1-5"|"0 5 * * *")  # Weekdays at 05:00 UTC: firewood-40m-41m
                DOW=$(date -u +%u)  # 1=Mon ... 6=Sat, 7=Sun
                if [[ "$DOW" -ge 6 ]]; then
                  echo "::notice::Weekend (DOW=$DOW) skipping"
                  exit 0
                fi
                echo "::notice::Schedule: daily-40m-41m"
                echo "name=daily-40m-41m" >> "$GITHUB_OUTPUT"
                echo "test=firewood-40m-41m" >> "$GITHUB_OUTPUT"
                echo "timeout-minutes=720" >> "$GITHUB_OUTPUT"
                ;;
              "5 5 * * 1-5")  # Weekdays at 05:05 UTC: firewood-33m-33m500k
                echo "::notice::Schedule: daily-33m-33m500k"
                echo "name=daily-33m-33m500k" >> "$GITHUB_OUTPUT"
                echo "test=firewood-33m-33m500k" >> "$GITHUB_OUTPUT"
                echo "timeout-minutes=720" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::Unknown schedule: ${GITHUB_EVENT_SCHEDULE}"
                exit 1
                ;;
            esac
          else
            # Manual dispatch - pass through inputs directly
            echo "name=manual" >> "$GITHUB_OUTPUT"
            echo "test=${INPUTS_TEST}" >> "$GITHUB_OUTPUT"
            echo "config=${INPUTS_CONFIG}" >> "$GITHUB_OUTPUT"
            echo "start-block=${INPUTS_START_BLOCK}" >> "$GITHUB_OUTPUT"
            echo "end-block=${INPUTS_END_BLOCK}" >> "$GITHUB_OUTPUT"
            echo "block-dir-src=${INPUTS_BLOCK_DIR_SRC}" >> "$GITHUB_OUTPUT"
            echo "current-state-dir-src=${INPUTS_CURRENT_STATE_DIR_SRC}" >> "$GITHUB_OUTPUT"
            echo "runner=${INPUTS_RUNNER}" >> "$GITHUB_OUTPUT"
            echo "timeout-minutes=${INPUTS_TIMEOUT_MINUTES}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUTS_TEST: ${{ inputs.test }}
          INPUTS_CONFIG: ${{ inputs.config }}
          INPUTS_START_BLOCK: ${{ inputs.start-block }}
          INPUTS_END_BLOCK: ${{ inputs.end-block }}
          INPUTS_BLOCK_DIR_SRC: ${{ inputs.block-dir-src }}
          INPUTS_CURRENT_STATE_DIR_SRC: ${{ inputs.current-state-dir-src }}
          INPUTS_RUNNER: ${{ inputs.runner }}
          INPUTS_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}

  benchmark:
    needs: configure-benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for github-action-benchmark to push to gh-pages
    steps:
      # NOTE: This checkout is only to get the bench-cchain-reexecution.sh script.
      # We're not building or testing Firewood here—the script triggers AvalancheGo's
      # workflow via API and passes FIREWOOD_REF to it. AvalancheGo is responsible
      # for checking out and building Firewood at that ref.
      - name: Checkout Firewood
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Trigger C-Chain Reexecution Benchmark
        run: ./scripts/bench-cchain-reexecution.sh trigger
        env:
          GH_TOKEN: ${{ secrets.FIREWOOD_AVALANCHEGO_GITHUB_TOKEN }}
          # Custom mode (ignored when TEST is specified)
          CONFIG: ${{ needs.configure-benchmark.outputs.config }}
          START_BLOCK: ${{ needs.configure-benchmark.outputs.start-block }}
          END_BLOCK: ${{ needs.configure-benchmark.outputs.end-block }}
          BLOCK_DIR_SRC: ${{ needs.configure-benchmark.outputs.block-dir-src }}
          CURRENT_STATE_DIR_SRC: ${{ needs.configure-benchmark.outputs.current-state-dir-src }}
          # Refs
          FIREWOOD_REF: ${{ inputs.firewood || github.sha }}
          AVALANCHEGO_REF: ${{ inputs.avalanchego }}
          LIBEVM_REF: ${{ inputs.libevm }}
          # Execution
          TEST: ${{ needs.configure-benchmark.outputs.test }}
          RUNNER: ${{ needs.configure-benchmark.outputs.runner }}
          TIMEOUT_MINUTES: ${{ needs.configure-benchmark.outputs.timeout-minutes }}

      # github.ref controls where results are stored (not what gets benchmarked):
      # - main branch → bench/ (official history)
      # - feature branches → dev/bench/{branch}/ (experimental, won't pollute trends)
      # inputs.firewood controls what gets benchmarked (passed to AvalancheGo).
      - name: Determine results location
        id: location
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "data-dir=bench" >> "$GITHUB_OUTPUT"
          else
            echo "data-dir=dev/bench/$(echo '${GITHUB_REF_NAME}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish benchmark results
        id: store
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # @v1.22.1
        with:
          name: C-Chain Reexecution with Firewood
          tool: 'customBiggerIsBetter'
          output-file-path: ./results/benchmark-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          auto-push: true
          fail-on-alert: true
          alert-threshold: "150%"
          comment-on-alert: false
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: ${{ steps.location.outputs.data-dir }}

      - name: Summary
        run: |
          [[ "${STEPS_STORE_OUTCOME}" == "failure" ]] && echo "::warning::Benchmark storage failed"

          {
            echo "## Benchmark: ${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_NAME}"
            echo
            if [[ -n "${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_TEST}" ]]; then
              echo "| Parameter | Value |"
              echo "|-----------|-------|"
              echo "| Test | \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_TEST}\` |"
            else
              echo "| Parameter | Value |"
              echo "|-----------|-------|"
              echo "| Config | \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_CONFIG}\` |"
              echo "| Blocks | \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_START_BLOCK}\` → \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_END_BLOCK}\` |"
              echo "| Block source | \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_BLOCK_DIR_SRC}\` |"
              echo "| State source | \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_CURRENT_STATE_DIR_SRC}\` |"
            fi
            echo "| Firewood | \`${INPUTS_FIREWOOD_OR_GITHUB_SHA}\` |"
            echo "| AvalancheGo | \`${INPUTS_AVALANCHEGO_OR_MASTER}\` |"
            echo "| libevm | \`${INPUTS_LIBEVM_OR}\` |"
            echo "| Runner | \`${NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_RUNNER}\` |"
            echo
            echo "[View trends](https://ava-labs.github.io/firewood/${STEPS_LOCATION_OUTPUTS_DATA_DIR}/)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUTS_AVALANCHEGO_OR_MASTER: ${{ inputs.avalanchego || 'master' }}
          INPUTS_FIREWOOD_OR_GITHUB_SHA: ${{ inputs.firewood || github.sha }}
          INPUTS_LIBEVM_OR: ${{ inputs.libevm || '-' }}
          STEPS_STORE_OUTCOME: ${{ steps.store.outcome }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_NAME: ${{ needs.configure-benchmark.outputs.name }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_TEST: ${{ needs.configure-benchmark.outputs.test }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_CONFIG: ${{ needs.configure-benchmark.outputs.config }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_START_BLOCK: ${{ needs.configure-benchmark.outputs.start-block }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_END_BLOCK: ${{ needs.configure-benchmark.outputs.end-block }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_BLOCK_DIR_SRC: ${{ needs.configure-benchmark.outputs.block-dir-src }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_CURRENT_STATE_DIR_SRC: ${{ needs.configure-benchmark.outputs.current-state-dir-src }}
          NEEDS_CONFIGURE_BENCHMARK_OUTPUTS_RUNNER: ${{ needs.configure-benchmark.outputs.runner }}
          STEPS_LOCATION_OUTPUTS_DATA_DIR: ${{ steps.location.outputs.data-dir }}
