name: attach-static-libs

on:
  workflow_dispatch:
    inputs:
      create_branch_name:
        description: "Name of the new branch to create and attach static libs"
        required: true
  push:
    tags:
      - "*"
    branches:
      - "main"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Build on stable, not the nightly rust-toolchain.toml pin; setup-rust's
  # default stable toolchain alone does not do that. See AGENTS.md,
  # "Toolchain Selection".
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build, upload, and collect static libraries for each target architecture,
# so that golang projects can import the FFI package without needing to
# recompile Firewood locally.
# Supported architectures are:
# - x86_64-unknown-linux-gnu
# - aarch64-unknown-linux-gnu
# - aarch64-apple-darwin
permissions: {}

jobs:
  # Detect whether the deploy key is configured. On forks without the
  # secret, the downstream push step cannot run and the multi-arch build
  # is wasted CI time — so skip the entire workflow there.
  check-secrets:
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check if FIREWOOD_GO_DEPLOY_KEY is set
        id: check
        env:
          FIREWOOD_GO_DEPLOY_KEY: ${{ secrets.FIREWOOD_GO_DEPLOY_KEY }}
        run: |
          if [ -z "$FIREWOOD_GO_DEPLOY_KEY" ]; then
            echo "FIREWOOD_GO_DEPLOY_KEY is not set"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "FIREWOOD_GO_DEPLOY_KEY is set"
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

  # Build the static libraries for each target architecture and upload
  # them as artifacts to collect and attach in the next job.
  build-firewood-ffi-libs:
    permissions:
      contents: read
    needs: check-secrets
    if: needs.check-secrets.outputs.has_secrets == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
            pre-build-cmd: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
    steps:
      - uses: $/.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools
          cache-key: ${{ matrix.target }}
          cache-save: "true"

      - name: Run pre-build command
        if: matrix.pre-build-cmd != ''
        run: ${{ matrix.pre-build-cmd }}

      # Require Cargo.lock to be up to date and ensure the registry cache is populated
      - name: Cargo Fetch (run `cargo generate-lockfile` if this fails)
        run: cargo fetch --locked --verbose

      - name: Build for ${{ matrix.target }}
        run: cargo build-static-ffi --target ${{ matrix.target }}

      - name: Strip LLVM bitcode sections
        run: ffi/scripts/strip-lto-sections.sh "target/${{ matrix.target }}/maxperf/libfirewood_ffi.a"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/maxperf/libfirewood_ffi.a
          if-no-files-found: error

  # Collect all the static libraries built on the previous matrix of jobs
  # and add them into ffi/libs directory.
  # We commit and push this as a new branch with "--force" to overwrite
  # the previous static libs that will not be on our branch.
  push-firewood-ffi-libs:
    permissions:
      contents: write
    needs: build-firewood-ffi-libs
    runs-on: ubuntu-24.04
    outputs:
      target_branch: ${{ steps.determine_branch.outputs.target_branch }}
    steps:
      - name: Determine branch name
        id: determine_branch
        env:
          INPUT_BRANCH: ${{ github.event.inputs.create_branch_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_BRANCH" ]]; then
            export target_branch="$INPUT_BRANCH"
            echo "Using workflow input as target branch: $target_branch"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            export target_branch="${GITHUB_REF#refs/tags/}"
            echo "Using tag name as target_branch: $target_branch"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            export target_branch="main-ci" # Avoid pushing to main branch of firewood-go repo
            echo "Using main-ci as target branch for push to main: $target_branch"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            export target_branch="pr/$PR_HEAD_REF"
            echo "Using PR head name as target branch: $target_branch"
          else
            echo "No valid input or tag found."
            exit 1
          fi

          # Reject names git would refuse, including control characters such as
          # newlines that could otherwise inject extra lines into GITHUB_OUTPUT.
          if ! git check-ref-format --branch "$target_branch"; then
            echo "Invalid target branch name."
            exit 1
          fi
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          path: firewood
          persist-credentials: true  # kept: job runs git commands that use the checkout token

      - uses: actions/checkout@v6
        with:
          repository: ava-labs/firewood-go
          ssh-key: ${{ secrets.FIREWOOD_GO_DEPLOY_KEY }}
          path: firewood-go
          persist-credentials: true  # kept: job runs git commands that use the checkout token

      - name: Copy FFI Source Code
        run: cp -r firewood/ffi firewood-go

      - name: Switch to Static Libs CGO Mode
        working-directory: firewood-go/ffi
        run: FIREWOOD_LD_MODE=STATIC_LIBS go generate

      - name: Download binaries into libs directory
        uses: actions/download-artifact@v8
        with:
          path: firewood-go/ffi/libs

      - name: List downloaded target directory
        run: find firewood-go -type f | sort

      - name: Push static libs to branch
        working-directory: firewood-go
        # GITHUB_TOKEN is configured in the last actions/checkout step
        # to have read/write permissions to the firewood-go repo.
        env:
          TARGET_BRANCH: ${{ steps.determine_branch.outputs.target_branch }}
        run: |
          git config --global user.name "FirewoodCI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"
          echo "Updating ffi module path before pushing to alternative remote"
          pushd ffi
          go mod edit -module github.com/ava-labs/firewood-go/ffi
          popd
          git add .
          git commit -m "firewood ci $GITHUB_SHA: attach firewood static libs"
          git push -u --force origin -- "$TARGET_BRANCH"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # If the tag is a semantic version, prefix it with "ffi/" to ensure go get correctly
            # fetches the submodule. Otherwise, use the tag name as is.
            # Note: we explicitly ignore semantic versions with suffixes ie. v1.1.1-beta because
            # go get treats them as non-semantic version tags.
            # Ref: https://github.com/ava-labs/firewood/pull/991
            if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tag_name="ffi/${GITHUB_REF#refs/tags/}"
            else
              tag_name="${GITHUB_REF#refs/tags/}"
            fi
            git tag -a "$tag_name" -m "firewood ci $GITHUB_SHA: attach firewood static libs"
            git push origin "refs/tags/$tag_name"
          fi

  # Check out the branch created in the previous job on a matrix of
  # our target architectures and test the FFI package on a fresh
  # machine without re-compiling Firewood locally.
  # This tests that the Firewood FFI package passes tests on the target
  # architecture when it is forced to depend on the attached static libs.
  test-firewood-ffi-libs:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    needs: push-firewood-ffi-libs
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ava-labs/firewood-go
          ssh-key: ${{ secrets.FIREWOOD_GO_DEPLOY_KEY }}
          ref: ${{ needs.push-firewood-ffi-libs.outputs.target_branch }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "ffi/go.mod"
          cache-dependency-path: "ffi/go.sum"
      - name: Test Go FFI bindings
        working-directory: ffi
        # cgocheck2 is expensive but provides complete pointer checks
        run: GOEXPERIMENT=cgocheck2 TEST_FIREWOOD_HASH_MODE=ethhash go test ./...

  remove-if-pr-only:
    runs-on: ubuntu-24.04
    needs: [push-firewood-ffi-libs, test-firewood-ffi-libs]
    # always() is required: without a status function, GitHub skips this job
    # whenever a job in `needs` fails, so a failing test-firewood-ffi-libs
    # would leave the pr/ branch behind in firewood-go.
    if: always() && needs.push-firewood-ffi-libs.result == 'success' && github.event_name == 'pull_request'
    permissions:
      # Give the GITHUB_TOKEN write permission to delete the
      # branch created by the previous job if it is a pull request.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ava-labs/firewood-go
          ssh-key: ${{ secrets.FIREWOOD_GO_DEPLOY_KEY }}
          ref: ${{ needs.push-firewood-ffi-libs.outputs.target_branch }}
          persist-credentials: true  # kept: job runs git commands that use the checkout token
      - name: Delete branch
        env:
          TARGET_BRANCH: ${{ needs.push-firewood-ffi-libs.outputs.target_branch }}
        run: |
          git push origin --delete "$TARGET_BRANCH"
