name: lint-nightly
on:
  schedule:
    # Mondays 06:00 UTC — surfaces new/changed nightly clippy lints out of band,
    # decoupled from PR gating (which runs the nightly pinned by
    # rust-toolchain.toml).
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  rust-lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile-key: debug-no-default-features
          - profile-key: debug-no-features
          - profile-key: debug-no-features
            os: macos-26
          - profile-key: debug-ethhash-logger
          - profile-key: debug-all-features
          - profile-key: maxperf-ethhash-logger
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      # Deliberately the floating nightly, not the rust-toolchain.toml pin:
      # `clippy-nightly` runs `cargo +nightly`, which outranks that file.
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: nightly
          components: clippy
          cache-key: ${{ matrix.profile-key }}
      - name: Clippy
        run: ./scripts/run-just.sh ci-rust clippy-nightly ${{ matrix.profile-key }}
